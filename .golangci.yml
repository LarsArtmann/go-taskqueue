version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
        - (*os.File).Sync
        - (net/http.ResponseWriter).Write
        - (*github.com/larsartmann/go-taskqueue/internal/queue.SQLiteStore).Close
    staticcheck:
      checks:
        - all
        - -QF1008
  exclusions:
    rules:
      # Tests: best-effort cleanup and stdout writes don't need error checks.
      - path: _test\.go
        linters:
          - errcheck
