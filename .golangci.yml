version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*archive/zip.ReadCloser).Close
        - (*os.File).Sync
        - (net/http.ResponseWriter).Write
        - (net/http.Response.Body).Close
  exclusions:
    rules:
      # Tests: best-effort cleanup and stdout writes don't need error checks.
      - path: _test\.go
        linters:
          - errcheck
