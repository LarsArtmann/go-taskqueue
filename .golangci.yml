version: "2"
run:
  timeout: 5m
  go: 1.26.7
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
output:
  formats: {}
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  default: standard
  settings:
    cyclop:
      max-complexity: 12
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
        - (*os.File).Sync
        - (net/http.ResponseWriter).Write
        - (*github.com/larsartmann/go-taskqueue/internal/queue.SQLiteStore).Close
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    gosec:
      # The 2026-09-10 triage (AGENTS.md "gosec advisory baseline") encoded
      # as excludes, kept in parity with the standalone gosec CI job's
      # -exclude list (ci.yml). A new finding in an excluded class needs a
      # fresh triage note, not a silent pass.
      excludes:
        - G104
        - G115
        - G118
        - G124
        - G202
        - G204
        - G301
        - G302
        - G304
        - G306
        - G404
        - G702
        - G703
        - G710
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    goconst:
      # Test tables repeat flag/env string literals on purpose (one item per
      # case is the table-driven readability contract); the 14 prod-code
      # findings stay advisory.
      ignore-tests: true
    makezero:
      always: true
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "100"
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    staticcheck:
      checks:
        - all
        - -QF1008
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - w
        - r
        - fs
        - db
        - id
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
      ignore-type-assert-ok: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - func (*flag.FlagSet).Parse(
        - func (*encoding/json.Encoder).Encode(
        - func encoding/json.Unmarshal(
        - func os.WriteFile(
        - func (*os/exec.Cmd).Output(
        - func (*strings.Builder).Write(
        - func (net/http.ResponseWriter).Write(
        - func (context.Context).Err(
        - func (*net/http.Server).ListenAndServe(
      ignore-package-globs:
        - github.com/larsartmann/go-taskqueue/internal/*
      ignore-interface-regexps:
        - queue\.Store
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - wrapcheck
          - varnamelen
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
