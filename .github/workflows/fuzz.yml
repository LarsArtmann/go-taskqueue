name: Fuzz

# Nightly fuzz campaign rotation: corpus growth must not depend on session
# memory (2026-09-06 18:34 report f21). The script fuzzes every committed
# target (FuzzParseRepo, FuzzExtractResultPayload) and syncs coverage-interesting
# inputs into each package's testdata/fuzz; this job commits them back so
# every future campaign — and every `go test` run — starts from the richest
# corpus. A push from here triggers the CI workflow, which validates the new
# seeds (each is executed as a regular test case).
on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC (off the top of the hour)
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "fuzztime (e.g. 60s, 5m)"
        required: false
        default: "60s"

permissions:
  contents: write # commit new seed corpus back to master

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Fuzz campaign rotation
        run: ./scripts/fuzz/nightly.sh "${{ github.event.inputs.fuzztime || '60s' }}"
      - name: Commit new seed corpora
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/harvest/testdata/fuzz internal/executor/testdata/fuzz
          if git diff --cached --quiet; then
            echo "no new seeds; nothing to commit"
            exit 0
          fi
          git commit -m "test(fuzz): grow nightly seed corpora (campaign rotation)"
          git push
      - name: Dump crash input (on failure)
        # go test writes failing inputs to the package testdata dir; keep
        # their content in the log (and the job red) since they must not be
        # committed — a committed crasher would keep `go test` red forever.
        if: failure()
        run: |
          shopt -s nullglob
          for f in internal/harvest/testdata/fuzz/FuzzParseRepo/* internal/executor/testdata/fuzz/FuzzExtractResultPayload/*; do
            echo "=== $f ==="
            cat "$f"
          done
