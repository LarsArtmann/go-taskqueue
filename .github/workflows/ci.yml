name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Windows build (cross-compile gate)
        run: GOOS=windows go build ./... && GOOS=windows go vet ./...
      - name: Test
        run: go test ./... -count=1 -race -timeout 120s
      - name: Gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Lint (golangci-lint, config in .golangci.yml)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 && "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: TODO_LIST harvest-parse guard
        run: go test ./internal/harvest/ -run TestRepoTodoListParses -count=1
      - name: Ghost-reference check (doc-cited paths exist)
        run: ./scripts/check-doc-refs.sh

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Nix build
        run: nix build
      - name: Nix flake check
        run: nix flake check
