name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# encoding/json/v2 symbols (jsontext.Value et al.) are gated behind
# GOEXPERIMENT=jsonv2 on the go 1.26 toolchain — local builds get it from
# ~/.config/go/env and flake.nix sets it for the nix gate; CI runners have
# a pristine env, so without this the stdversion check fails every package
# that touches json/v2 ("jsontext.Value requires go1.27"). One env here
# covers test, test-windows, test-postgres, govulncheck and gosec.
env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history for the scoped lint-annotations step (--new-from-rev
          # needs the base revision); the repo is under 1 MiB.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Windows build (cross-compile gate)
        run: |
          GOOS=windows go build ./... && GOOS=windows go vet ./...
          for m in $(find internal -name go.mod | sed 's|/go.mod$||' | sort); do
            ( cd "$m" && GOWORK=off GOOS=windows go build ./... && GOWORK=off GOOS=windows go vet ./... ) || exit 1
          done
      - name: Test
        run: go test ./... -count=1 -race -timeout 120s
      - name: Module isolation gates (GOWORK=off per sub-module)
        # ./... from the root never descends into nested modules, so without
        # this loop the sub-modules would silently drop out of every root
        # gate. Disk-derived: new modules are covered without editing this
        # workflow.
        run: |
          for m in $(find internal -name go.mod | sed 's|/go.mod$||' | sort); do
            echo "== $m"
            ( cd "$m" \
              && GOWORK=off go build ./... \
              && GOWORK=off go vet ./... \
              && GOWORK=off go test ./... -count=1 -timeout 120s ) || exit 1
          done
      - name: go.mod health (replaces, pins, toolchain alignment, mod verify)
        # Parity with scripts/ci-local.sh — the shared script owns the rules.
        run: ./scripts/check-go-mods.sh
      - name: Gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Lint (golangci-lint, config in .golangci.yml)
        # Advisory, not a gate: the ~400-finding repo baseline (wrapcheck,
        # varnamelen, paralleltest, ...) is documented in AGENTS.md; a red
        # master from it would bury real signal. golangci-lint v2 emits no
        # annotation commands itself, but actions/setup-go registers a "go"
        # problem matcher that scrapes every `file.go:line:col: msg` text
        # line into a [failure] annotation (capped at 10 per step); without
        # the remove-matcher below, every green run shows 10 stale baseline
        # "failures" (verified on the 2026-09-07 green run) that drown the
        # scoped warnings of the next step. Keep this step truly log-only;
        # the hard gates are vet, gofmt, tests.
        continue-on-error: true
        run: |
          echo "::remove-matcher owner=go::"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...
          # ./... from the root never descends into nested sub-modules
          # (ADR-0011) — mirror ci-local.sh's disk-derived loop so every
          # sub-module gets the same advisory run.
          for m in $(find internal -name go.mod | sed 's|/go.mod$||' | sort); do
            echo "== $m"
            ( cd "$m" && GOWORK=off "$(go env GOPATH)/bin/golangci-lint" run ./... ) || true
          done
      - name: Lint annotations (new findings on changed lines)
        # golangci-lint v2 has no github-actions output format and its text
        # output emits no ::warning commands, so nothing from the advisory run
        # above ever becomes an annotation — and the ~400-finding baseline
        # would blow GitHub's 10-warnings-per-step cap anyway. This re-runs
        # the same binary and config scoped to --new-from-rev so each new
        # finding becomes a real annotation that fits under the cap and
        # surfaces on green runs.
        continue-on-error: true
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/lint-annotations.sh
      - name: TODO_LIST harvest-parse guard
        run: go test ./internal/harvest/ -run TestRepoTodoListParses -count=1
      - name: Web UI live smoke (no browser)
        run: ./scripts/smoke/webui.sh
      - name: Release-gates smoke (fixture go.mods, positive + negative)
        run: ./scripts/smoke/release-gates.sh
      - name: Ghost-reference check (doc-cited paths exist)
        run: ./scripts/check-doc-refs.sh
      - name: Ghost-archive check (asset README promises are git-tracked)
        run: ./scripts/check-ghost-archives.sh

  test-windows:
    # Platform honesty (round-5 M11/F56): POSIX-only suites (e2e, chaos,
    # agent/review shell stubs) carry //go:build unix and drop out of this
    # run; everything that remains must actually pass on Windows. No -race
    # here: the race detector needs cgo + mingw on Windows, and race
    # coverage stays on the Linux job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
      - name: Test
        run: go test ./... -count=1 -timeout 300s
      - name: Module isolation gates (per sub-module)
        shell: bash
        run: |
          for m in $(find internal -name go.mod | sed 's|/go.mod$||' | sort); do
            echo "== $m"
            ( cd "$m" \
              && GOWORK=off go build ./... \
              && GOWORK=off go test ./... -count=1 -timeout 300s ) || exit 1
          done

  test-postgres:
    # Postgres store conformance (round-5 M21/ADR-0007): the same semantics
    # as the SQLite gate, against a real database via TQ_TEST_POSTGRES.
    # Local equivalent of this job's database:
    #   docker run --rm -d -p 5432:5432 -e POSTGRES_USER=tq -e POSTGRES_PASSWORD=tq -e POSTGRES_DB=tqtest postgres:16
    #   TQ_TEST_POSTGRES=postgres://tq:tq@localhost:5432/tqtest go test . -run TestPostgres -v
    # (from internal/queue/postgres; tests skip cleanly when the env is unset)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tq
          POSTGRES_PASSWORD: tq
          POSTGRES_DB: tqtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TQ_TEST_POSTGRES: postgres://tq:tq@localhost:5432/tqtest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
      - name: Postgres store conformance
        run: cd internal/queue/postgres && GOWORK=off go test . -run TestPostgres -count=1 -v

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Nix build
        run: nix build
      # Default (single-system) check: CI has no aarch64/darwin builders, so
      # `--all-systems` would fail on missing builders, not on real defects.
      # Cross-system evaluation is verified locally via
      # `nix flake check --all-systems --no-build` (round-5 M11/F57); the
      # supported-systems pin lives in flake.nix.
      - name: Nix flake check
        run: nix flake check

  govulncheck:
    # Advisory vulnerability scan (round-2 f20): job-level
    # continue-on-error keeps it non-blocking until the findings baseline
    # is understood — flip it off to make this a gate. Needs network on
    # the runner (the vuln DB is fetched live from vuln.go.dev), so unlike
    # the hermetic nix gates this can never run in checkPhase or
    # ci-local.sh. The version pin mirrors the golangci-lint step, and the
    # disk-derived module loop mirrors "Module isolation gates" above:
    # ./... from the root never descends into the nested sub-modules.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
      - name: Govulncheck (root + every sub-module)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          for m in $(find internal -name go.mod | sed 's|/go.mod$||' | sort); do
            echo "== $m"
            ( cd "$m" && GOWORK=off "$(go env GOPATH)/bin/govulncheck" ./... ) || exit 1
          done

  gosec:
    # Advisory security scan (round-2 f21), sibling of the govulncheck job:
    # job-level continue-on-error keeps it non-blocking. The 2026-09-10
    # triage (gosec v2.29.0, root + all sub-modules) found every finding a
    # false positive or by-design — see the AGENTS.md "gosec advisory
    # baseline" note for the per-rule rationale — so this stays advisory
    # until that note says otherwise. Needs network (module downloads), and
    # the disk-derived module loop mirrors "Module isolation gates".
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
      - name: Gosec (root + every sub-module)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          "$(go env GOPATH)/bin/gosec" -quiet ./...
          for m in $(find internal -name go.mod | sed 's|/go.mod$||' | sort); do
            echo "== $m"
            ( cd "$m" && GOWORK=off "$(go env GOPATH)/bin/gosec" -quiet ./... ) || exit 1
          done
